[project]
name = "holdingsbrief"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "wvlaing" }
]
requires-python = ">=3.14"
dependencies = [
    "google-api-python-client>=2.200.0",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.4.1",
    "httpx>=0.28.1",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "resend>=2.43.0",
    "yfinance>=1.7.0",
]

[project.scripts]
holdingsbrief = "holdingsbrief:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
